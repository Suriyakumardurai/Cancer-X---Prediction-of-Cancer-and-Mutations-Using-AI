<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CancerX | Predictive Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-color: #f1f5f9; /* slate-100 */
        --surface-color: #ffffff; /* white */
        --surface-muted-color: #f8fafc; /* slate-50 */
        --text-color: #0f172a; /* slate-900 */
        --text-muted-color: #64748b; /* slate-500 */
        --text-inverted-color: #ffffff;
        --accent-color: #0d9488; /* teal-600 */
        --accent-color-dark: #134e4a; /* teal-900 */
        --accent-color-light: #ccfbf1; /* teal-100 */
        --border-color: #e2e8f0; /* slate-200 */
        --focus-ring-color: #2dd4bf; /* teal-400 */

        --scrollbar-track-color: #e2e8f0;
        --scrollbar-thumb-color: #cbd5e1;
        --scrollbar-thumb-hover-color: #94a3b8;
      }
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }
      .animate-fade-in-up { animation: fade-in-up 0.4s ease-out forwards; }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-color);
        background-image: radial-gradient(circle at top left, #e0f2f1, transparent 40%), radial-gradient(circle at bottom right, #e0f2f1, transparent 50%);
        color: var(--text-color);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-attachment: fixed;
      }
      .light-scrollbar::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .light-scrollbar::-webkit-scrollbar-track {
        background: var(--scrollbar-track-color);
        border-radius: 4px;
      }
      .light-scrollbar::-webkit-scrollbar-thumb {
        background-color: var(--scrollbar-thumb-color);
        border-radius: 4px;
      }
      .light-scrollbar::-webkit-scrollbar-thumb:hover {
        background: var(--scrollbar-thumb-hover-color);
      }
      .section-card {
        background-color: var(--surface-color);
        border: 1px solid var(--border-color);
        border-radius: 1.5rem; /* 24px */
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
        transition: box-shadow 0.3s ease, transform 0.3s ease;
      }
      *:focus-visible {
        outline: 2px solid var(--focus-ring-color) !important;
        outline-offset: 2px;
        border-radius: 6px;
      }
      .prose-custom {
          font-size: 1rem;
          line-height: 1.75;
          color: #334155; /* slate-700 */
      }
      .prose-custom h2, .prose-custom h3, .prose-custom h4 {
          font-weight: 800;
          color: var(--text-color);
          margin-top: 2em;
          margin-bottom: 1em;
          padding-bottom: 0.5em;
          border-bottom: 1px solid var(--border-color);
          line-height: 1.3;
          letter-spacing: -0.02em;
      }
      .prose-custom h2 { font-size: 1.75rem; }
      .prose-custom h3 { font-size: 1.5rem; }
      .prose-custom h4 { font-size: 1.25rem; }
      .prose-custom p { margin-bottom: 1.25em; }
      .prose-custom ul {
          list-style-type: disc;
          padding-left: 1.5em;
          margin-bottom: 1.25em;
      }
      .prose-custom li { margin-bottom: 0.5em; }
      .prose-custom strong { font-weight: 700; color: var(--text-color); }
      .prose-custom table {
          width: 100%;
          border-collapse: collapse;
          margin-top: 2em;
          margin-bottom: 2em;
          font-size: 0.9rem;
      }
      .prose-custom th, .prose-custom td {
          border: 1px solid var(--border-color);
          padding: 0.75em 1em;
          text-align: left;
      }
      .prose-custom th {
          background-color: var(--surface-muted-color);
          font-weight: 600;
      }
      .table-container {
          overflow-x: auto;
          border: 1px solid var(--border-color);
          border-radius: 12px;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.20.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "react": "https://aistudiocdn.com/react@^19.1.1",
    "chart.js": "https://aistudiocdn.com/chart.js@^4.5.0",
    "path": "https://aistudiocdn.com/path@^0.12.7",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.0.4",
    "vite": "https://aistudiocdn.com/vite@^7.1.9",
    "url": "https://aistudiocdn.com/url@^0.11.4"
  }
}
</script>
</head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
