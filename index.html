<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CancerX | Predictive Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-color: #f8fafc; /* slate-50 */
        --surface-color-rgb: 255, 255, 255; /* white */
        --text-color: #1e293b; /* slate-800 */
        --text-muted-color: #64748b; /* slate-500 */
        --accent-color: #0d9488;
        --accent-color-dark: #134e4a;
        --accent-color-light: #f0fdfa; /* teal-50 */
        --border-color-rgb: 226, 232, 240; /* slate-200 */
        --focus-ring-color: #14b8a6;
        --scrollbar-track-color: hsl(220, 16%, 93%);
        --scrollbar-thumb-color: hsl(215, 20%, 82%);
        --scrollbar-thumb-hover-color: hsl(217, 16%, 65%);
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-attachment: fixed;
      }
      .light-scrollbar::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .light-scrollbar::-webkit-scrollbar-track {
        background: var(--scrollbar-track-color);
        border-radius: 4px;
      }
      .light-scrollbar::-webkit-scrollbar-thumb {
        background-color: var(--scrollbar-thumb-color);
        border-radius: 4px;
      }
      .light-scrollbar::-webkit-scrollbar-thumb:hover {
        background: var(--scrollbar-thumb-hover-color);
      }
      .section-card {
        background-color: rgb(var(--surface-color-rgb));
        border: 1px solid rgb(var(--border-color-rgb));
        border-radius: 1.5rem; /* 24px */
        box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.05), 0 4px 6px -4px rgb(0 0 0 / 0.05);
      }
      .prose { color: var(--text-color); }
      *:focus-visible {
        outline: 2px solid var(--focus-ring-color) !important;
        outline-offset: 2px;
      }
      /* Custom ProseMirror Styles for Readability */
      .prose-custom {
          font-size: 16px;
          line-height: 1.7;
          color: var(--text-color);
      }
      .prose-custom h2, .prose-custom h3, .prose-custom h4 {
          font-weight: 800;
          margin-top: 2em;
          margin-bottom: 1em;
          padding-bottom: 0.5em;
          border-bottom: 1px solid rgba(var(--border-color-rgb), 1);
          line-height: 1.3;
          letter-spacing: -0.02em;
      }
      .prose-custom h2 { font-size: 1.75rem; } /* 28px */
      .prose-custom h3 { font-size: 1.5rem; } /* 24px */
      .prose-custom h4 { font-size: 1.25rem; } /* 20px */
      .prose-custom p {
          margin-bottom: 1.25em;
      }
      .prose-custom ul {
          list-style-type: disc;
          padding-left: 1.5em;
          margin-bottom: 1.25em;
      }
      .prose-custom li {
          margin-bottom: 0.5em;
      }
      .prose-custom strong {
          font-weight: 700;
      }
      .prose-custom table {
          width: 100%;
          border-collapse: collapse;
          margin-top: 2em;
          margin-bottom: 2em;
          font-size: 14px;
      }
      .prose-custom th, .prose-custom td {
          border: 1px solid rgba(var(--border-color-rgb), 1);
          padding: 0.75em 1em;
          text-align: left;
      }
      .prose-custom th {
          background-color: #f8fafc; /* slate-50 */
          font-weight: 600;
      }
      .prose-custom tr:nth-child(even) {
          background-color: transparent;
      }
      .table-container {
          overflow-x: auto;
          border: 1px solid rgba(var(--border-color-rgb), 1);
          border-radius: 12px;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.20.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "react": "https://aistudiocdn.com/react@^19.1.1",
    "chart.js": "https://aistudiocdn.com/chart.js@^4.5.0",
    "path": "https://aistudiocdn.com/path@^0.12.7",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.0.4",
    "vite": "https://aistudiocdn.com/vite@^7.1.9",
    "url": "https://aistudiocdn.com/url@^0.11.4"
  }
}
</script>
</head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
